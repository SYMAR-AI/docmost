services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: docmost
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  docmost-typesense:
    image: typesense/typesense:27.1
    container_name: docmost-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-docmost-typesense-key}
    restart: unless-stopped
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - docmost-typesense-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docmost:
  db_data:
  redis_data:
  docmost-typesense-data:
